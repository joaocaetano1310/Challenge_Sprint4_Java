# Arquitetura completa do FutureVet em contêineres:
#   RabbitMQ (mensageria) · Eureka (descoberta) · futurevet-ia (Spring AI) · futurevet (aplicação web + API)
# Uso:  docker compose up --build      → http://localhost:8080  (painel do RabbitMQ: http://localhost:15672)
# A chave da IA vem do arquivo .env (IA_API_KEY=...), que não é versionado.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka:
    build: ./microsservicos/servidor-eureka
    ports:
      - "8761:8761"

  futurevet-ia:
    build: ./microsservicos/futurevet-ia
    environment:
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka/
      IA_API_KEY: ${IA_API_KEY:-nao-configurada}
      IA_BASE_URL: ${IA_BASE_URL:-https://api.groq.com/openai}
      IA_MODELO: ${IA_MODELO:-llama-3.3-70b-versatile}
    depends_on:
      - eureka

  futurevet:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_ADDRESS: 0.0.0.0
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://eureka:8761/eureka/
      IA_URL: ""
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      futurevet-ia:
        condition: service_started
