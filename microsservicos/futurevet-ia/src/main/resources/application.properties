spring.application.name=futurevet-ia
server.port=${PORT:8082}

# Provedor de IA compatível com a API da OpenAI.
# Padrão: Groq (gratuito) — https://console.groq.com/keys. Para OpenAI: IA_BASE_URL=https://api.openai.com e IA_MODELO=gpt-4o-mini
spring.ai.openai.api-key=${IA_API_KEY:nao-configurada}
spring.ai.openai.base-url=${IA_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${IA_MODELO:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=0.4
spring.ai.openai.chat.options.max-tokens=600

# Falha rápido: no máximo 2 tentativas, para o usuário não esperar demais se o provedor cair
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=3s

# Este serviço só usa chat; os demais modelos da OpenAI ficam desligados
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Registro no Eureka (ligado no docker-compose; desligado quando chamado por URL fixa)
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
info.app.nome=FutureVet IA
