spring.application.name=futurevet
spring.profiles.default=demo
server.port=${PORT:8080}

# Sessão e páginas de erro
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# Banco de dados (Flyway versiona o schema; o pool é pequeno por causa do plano gratuito)
spring.flyway.table=futurevet_web_history
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# Thymeleaf e internacionalização (pt-BR padrão, inglês via ?lang=en)
spring.thymeleaf.cache=true
spring.messages.basename=mensagens
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Segurança da API (JWT)
jwt.secret=${JWT_SECRET:troque-este-valor-por-uma-chave-secreta-com-pelo-menos-32-bytes}
jwt.expiration-minutes=720

# Mensageria: com RABBITMQ_ENABLED=false os eventos são entregues direto ao consumidor
futurevet.mensageria.rabbitmq=${RABBITMQ_ENABLED:false}
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
management.health.rabbit.enabled=${RABBITMQ_ENABLED:false}

# Microsserviços: IA via OpenFeign. IA_URL vazio = descobre o serviço pelo nome no Eureka
futurevet.ia.url=${IA_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.futurevet-ia.connect-timeout=5000
spring.cloud.openfeign.client.config.futurevet-ia.read-timeout=60000
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Monitoramento (Actuator): health e info públicos; métricas só para a clínica
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
management.info.java.enabled=true
info.app.nome=FutureVet
info.app.descricao=Plataforma de gestão veterinária — Challenge FIAP 2026 (Clyvo Vet)
info.app.versao=@project.version@
